name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes to account for GitHub delays
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render URL
        run: curl -I https://ai-secured-assesment.onrender.com/
